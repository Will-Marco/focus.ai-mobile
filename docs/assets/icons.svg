<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Ikonlar ilovaning o'z to'plami bilan bir tilda: 24×24, stroke 2, yumaloq uchlar.
       currentColor — rang CSS'dan meros bo'ladi. -->

  <!-- Brend belgisi: target (ilova ikonkasi bilan bir xil) -->
  <symbol id="i-target" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="7.5"/>
    <circle cx="12" cy="12" r="2.5"/>
  </symbol>

  <!-- Telefon yuztuban — "Away": orqasi yuqorida yotgan telefon + stol yuzasi -->
  <symbol id="i-facedown" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="4" width="14" height="10" rx="2.5"/>
    <circle cx="12" cy="9" r="1.6"/>
    <path d="M3 19h18"/>
  </symbol>

  <!-- Yon burish — "Focus Clock": landscape ekrandagi soat -->
  <symbol id="i-rotate" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="20" height="12" rx="2.5"/>
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M12 10.3V12l1.3 .9"/>
  </symbol>

  <!-- Streak / olov -->
  <symbol id="i-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2c1 3-1 4.5-2 6.5s.5 4 2.5 4 3-2.5 1.5-5.5c2.5 1.5 4 4.5 4 7.5a6 6 0 1 1-12 0c0-3 2-5.5 3-7.5"/>
  </symbol>

  <!-- Jamoa -->
  <symbol id="i-team" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="8" r="3.2"/>
    <path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>
    <path d="M16.5 5.4a3.2 3.2 0 0 1 0 5.2"/>
    <path d="M18 14.8c2 .8 3 2.6 3 5.2"/>
  </symbol>

  <!-- AI murabbiy -->
  <symbol id="i-sparkle" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/>
    <path d="M18.5 15l.8 2.3 2.2.7-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.7z"/>
  </symbol>

  <!-- Fon ovozi -->
  <symbol id="i-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V6l10-2v12"/>
    <circle cx="6" cy="18" r="3"/>
    <circle cx="16" cy="16" r="3"/>
  </symbol>

  <!-- Offline -->
  <symbol id="i-offline" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3l18 18"/>
    <path d="M8.5 15.5a5 5 0 0 1 7 0"/>
    <path d="M5 12a10 10 0 0 1 3.4-2.3"/>
    <path d="M19 12a10 10 0 0 0-7.6-2.9"/>
    <path d="M12 19h.01"/>
  </symbol>

  <!-- Kalendar / davr -->
  <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="16" rx="2.5"/>
    <path d="M3 10h18M8 3v4M16 3v4"/>
  </symbol>
</svg>
